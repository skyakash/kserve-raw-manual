apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: |-
      [
        {
          "apiVersion": "serving.kserve.io/v1alpha1",
          "kind": "KServeRaw",
          "metadata": {
            "name": "kserve-raw"
          },
          "spec": {
            "kserve": {
              "controller": {
                "deploymentMode": "RawDeployment"
              }
            }
          }
        }
      ]
    capabilities: Basic Install
    createdAt: "2026-02-16T10:36:44Z"
    operators.operatorframework.io/builder: operator-sdk-v1.33.0
    operators.operatorframework.io/project_layout: helm.sdk.operatorframework.io/v1
  name: kserve-raw-operator.v0.1.0
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
      - kind: KServeRaw
        name: kserveraws.serving.kserve.io
        version: v1alpha1
  description: |
    The KServe Raw Operator is a specialized Kubernetes operator designed to streamline the deployment of KServe in "Raw mode". 
    In this mode, KServe serves models using standard Kubernetes Deployments and Services, completely removing the dependency on Knative and Istio.

    ### Key Features:
    - **Zero Knative/Istio Density**: Lightweight model serving for vanilla Kubernetes clusters.
    - **Custom Deployment Mode**: Automatically configures KServe to use standard Kubernetes resources.
    - **OLM Managed**: Seamless lifecycle management through Operator Lifecycle Manager.
    - **Production Ready**: Built-in support for Scikit-Learn, PyTorch, and other KServe runtimes.
  displayName: KServe Raw Operator
  icon:
    - base64data: 
      mediatype: image/svg+xml
  install:
    spec:
      clusterPermissions:
        - rules:
            - apiGroups:
                - ""
              resources:
                - namespaces
              verbs:
                - get
            - apiGroups:
                - ""
              resources:
                - secrets
              verbs:
                - "*"
            - apiGroups:
                - ""
              resources:
                - events
              verbs:
                - create
            - apiGroups:
                - serving.kserve.io
              resources:
                - kserveraws
                - kserveraws/status
                - kserveraws/finalizers
              verbs:
                - create
                - delete
                - get
                - list
                - patch
                - update
                - watch
            - apiGroups:
                - admissionregistration.k8s.io
              resources:
                - mutatingwebhookconfigurations
                - validatingwebhookconfigurations
              verbs:
                - "*"
            - apiGroups:
                - rbac.authorization.k8s.io
              resources:
                - clusterrolebindings
                - clusterroles
              verbs:
                - "*"
            - apiGroups:
                - ""
              resources:
                - configmaps
                - serviceaccounts
                - services
              verbs:
                - "*"
            - apiGroups:
                - rbac.authorization.k8s.io
              resources:
                - rolebindings
                - roles
              verbs:
                - "*"
            - apiGroups:
                - apps
              resources:
                - deployments
              verbs:
                - "*"
            - apiGroups:
                - cert-manager.io
              resources:
                - certificates
                - issuers
              verbs:
                - "*"
            - apiGroups:
                - authentication.k8s.io
              resources:
                - tokenreviews
              verbs:
                - create
            - apiGroups:
                - authorization.k8s.io
              resources:
                - subjectaccessreviews
              verbs:
                - create
          serviceAccountName: kserve-raw-operator-controller-manager
      deployments:
        - label:
            app.kubernetes.io/component: manager
            app.kubernetes.io/created-by: kserve-raw-operator
            app.kubernetes.io/instance: controller-manager
            app.kubernetes.io/managed-by: kustomize
            app.kubernetes.io/name: deployment
            app.kubernetes.io/part-of: kserve-raw-operator
            control-plane: controller-manager
          name: kserve-raw-operator-controller-manager
          spec:
            replicas: 1
            selector:
              matchLabels:
                control-plane: controller-manager
            strategy: {}
            template:
              metadata:
                annotations:
                  kubectl.kubernetes.io/default-container: manager
                labels:
                  control-plane: controller-manager
              spec:
                containers:
                  - args:
                      - --secure-listen-address=0.0.0.0:8443
                      - --upstream=http://127.0.0.1:8080/
                      - --logtostderr=true
                      - --v=0
                    image: gcr.io/kubebuilder/kube-rbac-proxy:v0.14.1
                    name: kube-rbac-proxy
                    ports:
                      - containerPort: 8443
                        name: https
                        protocol: TCP
                    resources:
                      limits:
                        cpu: 500m
                        memory: 128Mi
                      requests:
                        cpu: 5m
                        memory: 64Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                  - args:
                      - --health-probe-bind-address=:8087
                      - --metrics-bind-address=:8086
                      - --leader-elect
                      - --leader-election-id=kserve-raw-operator
                    image: akashneha/kserve-raw-operator:v0.1.0
                    imagePullPolicy: Always
                    livenessProbe:
                      httpGet:
                        path: /healthz
                        port: 8087
                      initialDelaySeconds: 15
                      periodSeconds: 20
                    name: manager
                    readinessProbe:
                      httpGet:
                        path: /readyz
                        port: 8087
                      initialDelaySeconds: 5
                      periodSeconds: 10
                    resources:
                      limits:
                        cpu: 500m
                        memory: 128Mi
                      requests:
                        cpu: 10m
                        memory: 64Mi
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                securityContext:
                  runAsNonRoot: true
                serviceAccountName: kserve-raw-operator-controller-manager
                terminationGracePeriodSeconds: 10
      permissions:
        - rules:
            - apiGroups:
                - ""
              resources:
                - configmaps
              verbs:
                - get
                - list
                - watch
                - create
                - update
                - patch
                - delete
            - apiGroups:
                - coordination.k8s.io
              resources:
                - leases
              verbs:
                - get
                - list
                - watch
                - create
                - update
                - patch
                - delete
            - apiGroups:
                - ""
              resources:
                - events
              verbs:
                - create
                - patch
          serviceAccountName: kserve-raw-operator-controller-manager
    strategy: deployment
  installModes:
    - supported: false
      type: OwnNamespace
    - supported: false
      type: SingleNamespace
    - supported: false
      type: MultiNamespace
    - supported: true
      type: AllNamespaces
  keywords:
    - kserve
    - model-serving
    - machine-learning
    - ai
    - kubernetes
    - olm
    - raw-deployment
  links:
    - name: GitHub Repository
      url: https://github.com/skyakash/kserve-raw-manual
    - name: KServe Documentation
      url: https://kserve.github.io/website/
  maintainers:
    - email: akashneha@example.com
      name: akashneha
  maturity: alpha
  provider:
    name: akashneha
  version: 0.1.0
